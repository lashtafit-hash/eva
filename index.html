<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- ========= ТЕКСТ ВКЛАДКИ И ПРЕВЬЮ (меняйте здесь) ========= -->
  <title>Вдвоём</title>
  <meta name="description" content="Одна история на двоих.">

  <!-- ========= ПРЕВЬЮ ССЫЛКИ =========
       ВАЖНО: замените USERNAME и REPO на свои
       (адрес сайта на GitHub Pages: https://USERNAME.github.io/REPO/) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://USERNAME.github.io/REPO/">
  <meta property="og:title" content="Вдвоём">
  <meta property="og:description" content="Одна история на двоих.">
  <meta property="og:image" content="https://USERNAME.github.io/REPO/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://USERNAME.github.io/REPO/og-image.jpg">

  <meta name="theme-color" content="#2a0810">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@1,400;1,500&family=Manrope:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #1c050b;
      --wine: #3d0c17;
      --accent: #c8102e;
      --text: #f4ebe8;
      --muted: rgba(244, 235, 232, .6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Manrope", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      min-height: 100svh;
      display: grid;
    }

    /* Фото */
    .photo {
      position: relative;
      height: 100svh;
      overflow: hidden;
    }
    .photo img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 50% 30%;
      display: block;
      animation: settle 2.4s cubic-bezier(.2,.7,.2,1) both;
    }
    .photo::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 45%, rgba(28,5,11,.55) 70%, var(--bg) 100%);
      pointer-events: none;
    }

    /* Текст */
    .info {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 0 24px max(36px, env(safe-area-inset-bottom));
      z-index: 2;
      animation: rise 1.6s .5s cubic-bezier(.2,.7,.2,1) both;
    }
    .label {
      font-size: 11px;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex; align-items: center; gap: 12px;
    }
    .label::before {
      content: ""; width: 28px; height: 1px; background: var(--accent);
    }
    h1 {
      font-family: "Cormorant", Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(56px, 16vw, 128px);
      line-height: .95;
      letter-spacing: -.01em;
      margin: 14px 0 12px;
    }
    .sub {
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 32ch;
    }

    /* Компьютер: фото слева, текст справа */
    @media (min-width: 900px) {
      .page {
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1fr);
        background: radial-gradient(120% 90% at 100% 0%, var(--wine) 0%, var(--bg) 60%);
      }
      .photo::after {
        background: linear-gradient(to right, transparent 70%, rgba(28,5,11,.5) 100%);
      }
      .info {
        position: static;
        align-self: center;
        padding: 64px clamp(48px, 7vw, 120px);
      }
      .sub { font-size: 16px; }
    }

    @keyframes settle { from { transform: scale(1.06); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes rise   { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .photo img, .info { animation: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="photo">
      <img src="photo.jpg" alt="Двое на фоне бордовой стены складывают сердце из рук">
    </div>

    <!-- ========= ТЕКСТ НА СТРАНИЦЕ (меняйте здесь) ========= -->
    <section class="info">
      <p class="label">24 · 10 · 2026</p>
      <h1>Вдвоём</h1>
      <p class="sub">Одна история на двоих.</p>
    </section>
  </main>
</body>
</html>
